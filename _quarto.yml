project:
  type: website
  pre-render: generate_chapters.R
  render:
  - slides/*
  - videos/*
  - '*.qmd'
format:
  html:
    theme:
      dark: darkly
      light: flatly
    css: styles.css
    toc: false
    link-external-newwindow: true
execute:
  freeze: auto
website:
  title: Sequential Decision Analytics and Modeling (2e) Book Club
  sidebar:
    style: docked
    search: true
    tools:
    - icon: github
      href: https://github.com/AngelFelizR/bookclub-sdamodeling
    - icon: youtube
      href: https://www.youtube.com/playlist?list=PLLQZd6pMgcUA
    - icon: mastodon
      href: https://fosstodon.org/@DSLC
    - icon: linkedin
      href: https://www.linkedin.com/company/dslc-io
    contents:
    - index.qmd
    - file: slides/00.qmd
      target: sdamodeling_club-slides
    - 01.qmd
