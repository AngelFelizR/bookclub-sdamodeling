title: "{number}. {title}"
listing: 
  - contents: "slides/{number_wide}.qmd"
    id: slides
    type: grid
  - contents: "videos/{number_wide}"
    id: videos
    type: grid
    grid-columns: 2
    sort: "filename desc"
format:
  html:
    include-in-header:
      - text: |
          <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    include-after-body:
      - file: listing_new_window.js
